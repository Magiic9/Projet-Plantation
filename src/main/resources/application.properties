spring.application.name=plantation-manager

# ── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/Plantation
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
# Mettre à true pour voir les requêtes SQL (développement)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Serveur ───────────────────────────────────────────────────────────────────
server.port=8080
# La borne reste connectée toute la journée
server.servlet.session.timeout=12h

# ── Comptes (mots de passe dans les variables d'environnement) ────────────────
plantation.admin.username=${ADMIN_USERNAME:patron}
plantation.admin.password=${ADMIN_PASSWORD}
plantation.borne.username=${BORNE_USERNAME:borne}
plantation.borne.password=${BORNE_PASSWORD}

# ── Règles de la plantation (à adapter) ───────────────────────────────────────
# Heure normale d'arrivée et tolérance avant de marquer un retard
plantation.heure-debut-journee=07:00
plantation.tolerance-retard-minutes=10
# Au-delà de ce nombre d'heures par semaine, les heures sont majorées
plantation.heures-normales-par-semaine=35
# 0.25 = heures sup payées 25 % de plus
plantation.majoration-heures-sup=0.25
